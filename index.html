<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tabaam.print</title>
</head>
<body>
<style>
  :root{
    --bg:#E7DFCF;
    --card:#F4EFE3;
    --ink:#171310;
    --ink-soft:#6B6255;
    --line-strong:#B7A98C;
    --gold-2:#9C7423;
    --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#15120E; --card:#221C15; --ink:#F1EAD9; --ink-soft:#B4A891; --line-strong:#4B4536; --gold-2:#C79A44; }
  }
  :root[data-theme="dark"]{ --bg:#15120E; --card:#221C15; --ink:#F1EAD9; --ink-soft:#B4A891; --line-strong:#4B4536; --gold-2:#C79A44; }
  :root[data-theme="light"]{ --bg:#E7DFCF; --card:#F4EFE3; --ink:#171310; --ink-soft:#6B6255; --line-strong:#B7A98C; --gold-2:#9C7423; }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{background:var(--bg);}

  #hero{
    position:relative;
    min-height:100dvh;
    background:var(--bg);
    overflow:hidden;
    display:flex;
    flex-direction:column;
    font-family:var(--font-sans);
    color:var(--ink);
  }

  #stage{ position:relative; flex:1; min-height:0; touch-action:pan-y; }
  #mockups{
    position:absolute; inset:0;
    opacity:0; transform:scale(.965);
    transition:opacity .6s ease, transform .6s cubic-bezier(.22,.61,.36,1);
  }
  #hero.mockups-in #mockups{ opacity:1; transform:scale(1); }

  .mockup{
    position:absolute; left:50%; top:50%;
    width:clamp(168px,22vw,300px);
    transform:translate(-50%,-50%) translateX(var(--offset,0px)) scale(var(--scale,1));
    opacity:var(--op,1);
    transition:transform .56s cubic-bezier(.22,.61,.36,1), opacity .5s ease;
    will-change:transform,opacity;
    cursor:pointer;
  }
  .mockup-card{
    background:var(--card);
    border-radius:12px;
    padding:4px;
    box-shadow:0 22px 34px -16px rgba(23,19,16,.38), 0 3px 8px rgba(23,19,16,.10);
  }
  .mockup img{ display:block; width:100%; height:auto; border-radius:10px; -webkit-user-drag:none; user-select:none; pointer-events:none; }

  #logoLayer{
    position:absolute; left:50%; top:50%;
    width:clamp(100px,13vw,168px);
    transform:translate(-50%,-50%) translate(var(--lx,0px),var(--ly,0px)) scale(var(--ls,1));
    transition:transform .62s cubic-bezier(.34,1.56,.64,1) var(--logo-delay,0s),
               opacity .35s ease var(--logo-delay,0s);
    opacity:0;
    pointer-events:none;
    z-index:500;
  }
  #hero.logo-in #logoLayer{ opacity:1; }
  #logoLayer img{ display:block; width:100%; height:auto; -webkit-user-drag:none; user-select:none; }

  .arrow{
    position:absolute; top:50%; transform:translateY(-50%);
    width:46px; height:46px; border-radius:50%;
    border:none; background:var(--card);
    box-shadow:0 10px 24px rgba(23,19,16,.18), 0 2px 6px rgba(23,19,16,.08);
    display:flex; align-items:center; justify-content:center;
    color:var(--ink); cursor:pointer;
    opacity:0; pointer-events:none;
    transition:opacity .5s ease, background-color .25s ease, color .25s ease, box-shadow .25s ease;
    z-index:600;
  }
  .arrow svg{ width:16px; height:16px; }
  .arrow:hover{ background:var(--ink); color:var(--bg); box-shadow:0 12px 28px rgba(23,19,16,.24), 0 2px 6px rgba(23,19,16,.1); }
  .arrow:focus-visible{ outline:2px solid var(--gold-2); outline-offset:3px; }
  .arrow.prev{ left:clamp(8px,3vw,30px); }
  .arrow.next{ right:clamp(8px,3vw,30px); }
  #hero.ready .arrow{ opacity:1; pointer-events:auto; }

  .meta-bar{
    position:relative; flex:none;
    display:flex; flex-direction:column; align-items:center; gap:12px;
    padding:0 20px clamp(22px,5vh,44px);
  }
  .eyebrow-label{
    font-size:10px; letter-spacing:.18em; text-transform:uppercase;
    color:var(--ink-soft);
    opacity:0; transition:opacity .35s ease;
  }
  #hero.ready .eyebrow-label{ opacity:1; }

  .caption{
    display:inline-flex; align-items:center; gap:7px;
    font-size:13.5px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--ink); text-decoration:none;
    opacity:0; transition:opacity .35s ease, color .25s ease;
    cursor:pointer;
  }
  #hero.ready .caption{ opacity:1; }
  .caption.is-out{ opacity:0 !important; }
  .caption-text{
    background-image:linear-gradient(var(--ink),var(--ink));
    background-repeat:no-repeat;
    background-position:0 100%;
    background-size:0% 1px;
    transition:background-size .3s ease;
    padding-bottom:2px;
  }
  .caption-arrow{
    display:inline-flex; width:15px; height:15px;
    color:var(--gold-2);
    transition:transform .3s cubic-bezier(.22,.61,.36,1);
  }
  .caption-arrow svg{ width:100%; height:100%; }
  .caption:hover .caption-text,
  .caption:focus-visible .caption-text{ background-size:100% 1px; }
  .caption:hover .caption-arrow,
  .caption:focus-visible .caption-arrow{ transform:translateX(4px); }
  .caption:focus-visible{ outline:2px solid var(--gold-2); outline-offset:5px; border-radius:2px; }
  .dots{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; max-width:260px; opacity:0; transition:opacity .5s ease; }
  #hero.ready .dots{ opacity:1; }
  .dot{
    width:6px; height:6px; border-radius:50%;
    background:var(--line-strong); border:none; padding:0; cursor:pointer;
    transition:background-color .3s ease, transform .3s ease;
  }
  .dot:focus-visible{ outline:2px solid var(--gold-2); outline-offset:3px; }
  .dot.is-active{ background:var(--ink); transform:scale(1.55); }

  @media (max-width:640px){
    .meta-bar{ padding-bottom:clamp(18px,6vh,32px); }
    .arrow{ width:38px; height:38px; }
  }

  @media (prefers-reduced-motion: reduce){
    #mockups, .mockup, #logoLayer, .caption, .caption-text, .caption-arrow, .eyebrow-label, .dots, .arrow{
      transition-duration:.001s !important;
      transition-delay:0s !important;
    }
  }
</style>

<section id="hero" aria-label="Витрина бренда tabaam.print">
  <div id="stage">
    <div id="mockups">
      <div class="mockup" data-slug="bag" data-spot-x="48" data-spot-y="54" data-spot-w="32"><div class="mockup-card"><img src="assets/image-25-07-26-04-31-12.png" alt="Картонные брендированные пакеты"></div></div>
      <div class="mockup" data-slug="ribbon" data-spot-x="50" data-spot-y="57" data-spot-w="15"><div class="mockup-card"><img src="assets/image-25-07-26-04-31-13.png" alt="Брендированная лента"></div></div>
      <div class="mockup" data-slug="box" data-spot-x="50" data-spot-y="58" data-spot-w="28"><div class="mockup-card"><img src="assets/image-25-07-26-04-31-1.png" alt="Брендированные коробки"></div></div>
      <div class="mockup" data-slug="tag" data-spot-x="50" data-spot-y="60" data-spot-w="26"><div class="mockup-card"><img src="assets/image-25-07-26-04-31-4.png" alt="Подвесные картонные бирки"></div></div>
      <div class="mockup" data-slug="patch" data-spot-x="50" data-spot-y="48" data-spot-w="13"><div class="mockup-card"><img src="assets/image-25-07-26-04-31-9.png" alt="Пришивные бирки"></div></div>
      <div class="mockup" data-slug="stickers" data-spot-x="50" data-spot-y="48" data-spot-w="26"><div class="mockup-card"><img src="assets/image-25-07-26-04-31-8.png" alt="Наклейки"></div></div>
      <div class="mockup" data-slug="souvenir" data-spot-x="50" data-spot-y="44" data-spot-w="17"><div class="mockup-card"><img src="assets/image-25-07-26-08-34-1.png" alt="Корпоративная сувенирная продукция"></div></div>
      <div class="mockup" data-slug="stamp" data-spot-x="38" data-spot-y="52" data-spot-w="24"><div class="mockup-card"><img src="assets/image-25-07-26-04-31-2.png" alt="Штамп/печать"></div></div>
      <div class="mockup" data-slug="paper-small" data-spot-x="50" data-spot-y="50" data-spot-w="18"><div class="mockup-card"><img src="assets/image-25-07-26-08-34.png" alt="Бумажная продукция небольшие тиражи"></div></div>
      <div class="mockup" data-slug="tissue" data-spot-x="40" data-spot-y="50" data-spot-w="14"><div class="mockup-card"><img src="assets/image-25-07-26-04-31-5.png" alt="Тишью/калька/крафт"></div></div>
      <div class="mockup" data-slug="plastic-bag" data-spot-x="50" data-spot-y="55" data-spot-w="24"><div class="mockup-card"><img src="assets/image-25-07-26-04-31-7.png" alt="Полиэтиленовые брендированные пакеты"></div></div>
      <div class="mockup" data-slug="paper-large" data-spot-x="50" data-spot-y="50" data-spot-w="18"><div class="mockup-card"><img src="assets/image-25-07-26-08-34.png" alt="Бумажная продукция большие тиражи"></div></div>
      <div class="mockup" data-slug="chocolate" data-spot-x="50" data-spot-y="50" data-spot-w="24"><div class="mockup-card"><img src="assets/image-25-07-26-04-31-11.png" alt="Брендированные шоколадки"></div></div>
    </div>

    <div id="logoLayer" aria-hidden="true">
      <img src="assets/1%D0%A0%D0%B5%D1%81%D1%83%D1%80%D1%81%20224%403x-11.png" alt="">
    </div>

    <button class="arrow prev" type="button" aria-label="Предыдущее изделие">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 L8 12 L15 19"></path></svg>
    </button>
    <button class="arrow next" type="button" aria-label="Следующее изделие">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5 L16 12 L9 19"></path></svg>
    </button>
  </div>

  <div class="meta-bar">
    <span class="eyebrow-label">Рассчитать стоимость</span>
    <a class="caption" id="caption" href="category.html#bag">
      <span class="caption-text">Пакет с верёвочными ручками</span>
      <span class="caption-arrow" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
      </span>
    </a>
    <div class="dots" id="dots" role="tablist" aria-label="Выбор изделия"></div>
  </div>
</section>

<script>
(function(){
  var hero = document.getElementById('hero');
  var stage = document.getElementById('stage');
  var track = document.getElementById('mockups');
  var logo = document.getElementById('logoLayer');
  var mockupEls = Array.prototype.slice.call(track.querySelectorAll('.mockup'));
  var dotsWrap = document.getElementById('dots');
  var captionEl = document.getElementById('caption');
  var captionTextEl = captionEl.querySelector('.caption-text');
  var prevBtn = document.querySelector('.arrow.prev');
  var nextBtn = document.querySelector('.arrow.next');
  var N = mockupEls.length;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var NAMES = mockupEls.map(function(el){ return el.querySelector('img').getAttribute('alt'); });
  var SLUGS = mockupEls.map(function(el){ return el.getAttribute('data-slug') || ''; });

  NAMES.forEach(function(name, i){
    var b = document.createElement('button');
    b.className = 'dot' + (i === 0 ? ' is-active' : '');
    b.type = 'button';
    b.setAttribute('aria-label', 'Изделие ' + (i + 1) + ': ' + name);
    dotsWrap.appendChild(b);
  });
  var dotEls = Array.prototype.slice.call(dotsWrap.querySelectorAll('.dot'));

  var active = 0;
  var isAnimating = true;
  var dragging = false, dragStartX = 0, dragCurX = 0, pointerId = null;
  var logoBaseWidth = 1;

  function spacing(){
    var w = stage.clientWidth;
    return Math.max(140, Math.min(w * 0.24, 230));
  }

  function shortestDist(i, act){
    var d = i - act;
    if (d > N / 2) d -= N;
    if (d < -N / 2) d += N;
    return d;
  }

  function layout(extraDeltaPx){
    var sp = spacing();
    var delta = extraDeltaPx || 0;
    mockupEls.forEach(function(el, i){
      var d = shortestDist(i, active);
      var off = d * sp + delta;
      var absd = Math.abs(d);
      var scale = Math.max(0.58, 1 - absd * 0.17);
      var op = absd <= 2 ? Math.max(0, 1 - absd * 0.42) : 0;
      el.style.setProperty('--offset', off.toFixed(1) + 'px');
      el.style.setProperty('--scale', scale.toFixed(3));
      el.style.setProperty('--op', op.toFixed(3));
      el.style.zIndex = 100 - absd * 10;
      el.style.pointerEvents = absd <= 1 ? 'auto' : 'none';
    });
  }

  function measureLogo(){
    logo.style.setProperty('--ls', '1');
    logoBaseWidth = logo.offsetWidth || 1;
  }

  function logoTargetFor(i){
    var el = mockupEls[i];
    var sx = parseFloat(el.getAttribute('data-spot-x'));
    var sy = parseFloat(el.getAttribute('data-spot-y'));
    var sw = parseFloat(el.getAttribute('data-spot-w'));
    var w = el.offsetWidth, h = el.offsetHeight;
    var dx = (sx / 100 - 0.5) * w;
    var dy = (sy / 100 - 0.5) * h;
    var scale = ((sw / 100) * w) / logoBaseWidth;
    return { dx: dx, dy: dy, scale: scale };
  }

  function setLogoTransform(dx, dy, scale, delayMs){
    logo.style.transitionDelay = (delayMs || 0) + 'ms';
    logo.style.setProperty('--lx', dx.toFixed(1) + 'px');
    logo.style.setProperty('--ly', dy.toFixed(1) + 'px');
    logo.style.setProperty('--ls', scale.toFixed(3));
  }

  function updateMeta(){
    captionTextEl.textContent = NAMES[active];
    captionEl.setAttribute('href', 'category.html#' + SLUGS[active]);
    dotEls.forEach(function(d, i){ d.classList.toggle('is-active', i === active); });
  }

  function goTo(i, opts){
    opts = opts || {};
    if (isAnimating && !opts.force) return;
    active = ((i % N) + N) % N;
    isAnimating = true;
    layout(0);

    captionEl.classList.add('is-out');
    setTimeout(function(){
      updateMeta();
      captionEl.classList.remove('is-out');
    }, reduce ? 0 : 170);

    var delay = opts.introDelay != null ? opts.introDelay : (reduce ? 0 : 180);
    var t = logoTargetFor(active);
    setLogoTransform(t.dx, t.dy, t.scale, delay);

    var total = delay + (reduce ? 0 : 640) + 60;
    setTimeout(function(){ isAnimating = false; }, total);
  }

  prevBtn.addEventListener('click', function(){ goTo(active - 1); });
  nextBtn.addEventListener('click', function(){ goTo(active + 1); });
  dotEls.forEach(function(d, i){ d.addEventListener('click', function(){ if (i !== active) goTo(i); }); });
  mockupEls.forEach(function(el, i){ el.addEventListener('click', function(){ if (i !== active) goTo(i); }); });

  window.addEventListener('keydown', function(e){
    if (e.key === 'ArrowLeft') goTo(active - 1);
    if (e.key === 'ArrowRight') goTo(active + 1);
  });

  stage.addEventListener('pointerdown', function(e){
    if (isAnimating) return;
    dragging = true; pointerId = e.pointerId;
    dragStartX = e.clientX; dragCurX = e.clientX;
    try { stage.setPointerCapture(pointerId); } catch(err){}
    mockupEls.forEach(function(el){ el.style.transition = 'none'; });
    logo.style.transition = 'none';
  });
  stage.addEventListener('pointermove', function(e){
    if (!dragging) return;
    dragCurX = e.clientX;
    var delta = dragCurX - dragStartX;
    layout(delta);
    var fade = Math.max(0, 1 - Math.abs(delta) / (spacing() * 0.6));
    logo.style.opacity = fade.toFixed(3);
  });
  function endDrag(){
    if (!dragging) return;
    dragging = false;
    mockupEls.forEach(function(el){ el.style.transition = ''; });
    logo.style.transition = '';
    logo.style.opacity = '';
    var delta = dragCurX - dragStartX;
    var sp = spacing();
    if (Math.abs(delta) > sp * 0.22){
      goTo(active + (delta < 0 ? 1 : -1), { introDelay: reduce ? 0 : 120 });
    } else {
      layout(0);
      var t = logoTargetFor(active);
      setLogoTransform(t.dx, t.dy, t.scale, 0);
    }
  }
  stage.addEventListener('pointerup', endDrag);
  stage.addEventListener('pointercancel', endDrag);
  stage.addEventListener('pointerleave', function(){ if (dragging) endDrag(); });

  window.addEventListener('resize', function(){
    measureLogo();
    layout(0);
    if (!dragging){
      var t = logoTargetFor(active);
      logo.style.transition = 'none';
      setLogoTransform(t.dx, t.dy, t.scale, 0);
      requestAnimationFrame(function(){ logo.style.transition = ''; });
    }
  });

  function boot(){
    measureLogo();
    layout(0);
    updateMeta();

    if (reduce){
      var t0 = logoTargetFor(0);
      setLogoTransform(t0.dx, t0.dy, t0.scale, 0);
      hero.classList.add('logo-in', 'mockups-in', 'ready');
      isAnimating = false;
      return;
    }

    var t0r = logoTargetFor(0);
    var heroScale = t0r.scale * 1.85;
    logo.style.transition = 'none';
    setLogoTransform(0, -stage.clientHeight * 0.09, heroScale, 0);

    requestAnimationFrame(function(){
      logo.style.transition = '';
      hero.classList.add('logo-in');

      setTimeout(function(){
        hero.classList.add('mockups-in');

        setTimeout(function(){
          var t = logoTargetFor(active);
          setLogoTransform(t.dx, t.dy, t.scale, 0);

          setTimeout(function(){
            hero.classList.add('ready');
            isAnimating = false;
          }, 660);
        }, 480);
      }, 900);
    });
  }

  function startWhenVisible(fn){
    if (document.visibilityState === 'visible'){
      requestAnimationFrame(function(){ requestAnimationFrame(fn); });
      return;
    }
    var handler = function(){
      if (document.visibilityState === 'visible'){
        document.removeEventListener('visibilitychange', handler);
        requestAnimationFrame(function(){ requestAnimationFrame(fn); });
      }
    };
    document.addEventListener('visibilitychange', handler);
  }

  startWhenVisible(boot);
})();
</script>

</body>
</html>
